<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Menú superior de navegación -->
    <header>
        <nav>
            <button class="btn-nav activo" data-target="inicio">Inicio</button>
            <button class="btn-nav" data-target="Ilustraciones">Ilustraciones</button>
            <button class="btn-nav" data-target="DiseñoArtesanal">Diseño artesanal</button>
            <button class="btn-nav" data-target="Logofolio">Logofolio</button>
            <button class="btn-nav" data-target="VibraCesde">Vibra CESDE</button>
            <button class="btn-nav" data-target="RuedaFlotante">Rueda Flotante</button>
        </nav>
    </header>

    <!-- Contenido principal -->
    <main>

        <!-- 1. Sección Inicio -->
        <section id="inicio" class="seccion activa">
            <div class="portada-imagen">
                <img src="imagenes/Mesa de trabajo 1.png" alt="Portafolio Azzro">
            </div>

            <div class="contenido-abajo">
                <div class="galeria-vertical">
                    <img src="imagenes/Mesa de trabajo 1.2.png" alt="Trabajo 1">
                    <img src="imagenes/Mesa de trabajo 1.1.png" alt="Trabajo 2">
                    <img src="imagenes/mesa de trabajo 1.3.jpeg" alt="Trabajo 3">
                </div>
            </div>
        </section>

        <!-- 2. Sección Ilustraciones -->
        <section id="Ilustraciones" class="seccion">
            <div class="contenido-abajo">
                <div class="galeria-vertical">
                    <!-- Agrega aquí las imágenes de Ilustraciones -->
                    <img src="imagenes/Mesa de trabajo 2.png" alt="Ilustración 1">
                    <img src="imagenes/Mesa de trabajo 2.2.png" alt="Ilustración 2">
                    <img src="imagenes/Mesa de trabajo 2.3.png" alt="Ilustración 3">
                    <img src="imagenes/Mesa de trabajo 2.4.png" alt="Ilustración 4">
                </div>
            </div>
        </section>

        <!-- 3. Sección Diseño Artesanal -->
        <section id="DiseñoArtesanal" class="seccion">
            <div class="contenido-abajo">
                <div class="galeria-vertical">
                    <!-- Agrega aquí las imágenes de Diseño Artesanal -->
                    <img src="imagenes/Mesa de trabajo 3.png" alt="Diseño Artesanal 1">
                    <img src="imagenes/Mesa de trabajo 3.1.png" alt="Diseño Artesanal 2">
                    <img src="imagenes/Mesa de trabajo 3.2.png" alt="Diseño Artesanal 3">
                    <img src="imagenes/Mesa de trabajo 3.3.png" alt="Diseño Artesanal 4">
                </div>
            </div>
        </section>

        <!-- 4. Sección Logofolio -->
        <section id="Logofolio" class="seccion">
            <div class="contenido-abajo">
                <div class="galeria-vertical">
                    <!-- Agrega aquí las imágenes de Logofolio -->
                    <img src="imagenes/Mesa de trabajo 4.png" alt="Logo 1">
                    <img src="imagenes/Mesa de trabajo 4.1.png" alt="Logo 2">
                    <img src="imagenes/Mesa de trabajo 4.2.png" alt="Logo 3">
                    <img src="imagenes/Mesa de trabajo 4.3.png" alt="Logo 4">
                    <img src="imagenes/Mesa de trabajo 4.4.png" alt="Logo 5">
                </div>
            </div>
        </section>

        <!-- 5. Sección Vibra CESDE -->
        <section id="VibraCesde" class="seccion">
            <div class="contenido-abajo">
                <div class="galeria-vertical">
                    <!-- Agrega aquí las imágenes de Vibra CESDE -->
                    <img src="imagenes/Mesa de trabajo 5.png" alt="Vibra CESDE 1">
                    <img src="imagenes/Mesa de trabajo 5.1.png" alt="Vibra CESDE 2">
                    <img src="imagenes/Mesa de trabajo 5.2.png" alt="Vibra CESDE 3">
                    <img src="imagenes/Mesa de trabajo 5.3.png" alt="Vibra CESDE 4">
                    <img src="imagenes/Mesa de trabajo 5.4.png" alt="Vibra CESDE 5">
                    <img src="imagenes/Mesa de trabajo 5.5.png" alt="Vibra CESDE 6">
                </div>
            </div>
        </section>

        <!-- 6. Sección Rueda Flotante -->
        <section id="RuedaFlotante" class="seccion">
            <div class="contenido-abajo">
                <div class="galeria-vertical">
                    <!-- Agrega aquí las imágenes de Rueda Flotante -->
                    <img src="imagenes/Mesa de trabajo 6.png" alt="La rueda flotante 1">
                    <img src="imagenes/Mesa de trabajo 6.1.png" alt="La rueda flotante 2">
                    <img src="imagenes/Mesa de trabajo 6.2.png" alt="La rueda flotante 3">
                    <img src="imagenes/Mesa de trabajo 6.3.png" alt="La rueda flotante 4">
                </div>
            </div>
        </section>

    </main>

   <!-- Botón flotante de contacto -->
    <a href="https://linktr.ee/AQUI_EL_USUARIO_DE_TOBIAS" target="_blank" rel="noopener noreferrer" class="btn-flotante">
        Contáctame
    </a>

    <script src="script.js"></script>
</body>
</html>
